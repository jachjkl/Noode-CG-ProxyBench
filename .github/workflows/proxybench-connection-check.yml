name: 本地执行器连接与代理实测诊断
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noode-cg-proxybench
  cancel-in-progress: false
jobs:
  connection-check:
    if: github.repository == 'jachjkl/Noode-CG-ProxyBench' && github.actor == 'jachjkl'
    runs-on: [self-hosted, windows, x64, noode-cg-proxybench]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Measure 100 saved candidates and maintain real Runner connection for 13 minutes
        run: |
          & $env:NOODE_PROXYBENCH_PYTHON scripts/proxybench_connection_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Connection diagnostic failed; owner checkpoint was not modified' }
      - name: Save public diagnostic report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proxybench-connection-check
          path: ${{ runner.temp }}/proxybench-connection-check/report.json
